# ============================================================
# Phase 5 Step 5 — Production Nginx Reverse Proxy Configuration
# Handles SSL/TLS termination, SPA routing, API proxying, and WebSocket upgrades
# ============================================================

# HTTP — Redirect all traffic to HTTPS (port 443)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect permanently to HTTPS preserving host and URI
    return 301 https://$host$request_uri;
}

# HTTPS — Main Application Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Production TLS Configuration (Decision 5.2 — Externally Provisioned SSL)
    ssl_certificate /etc/ssl/certs/drch.crt;
    ssl_certificate_key /etc/ssl/private/drch.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Root directory for static frontend SPA assets
    root /usr/share/nginx/html;
    index index.html;

    # Global proxy header defaults
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Service Worker — Must be served from root with no-cache and root scope allowed
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Static assets with content hashing — Immutable cache (1 year)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — Never cache to guarantee immediate deployment updates
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Health Check — Direct proxy to backend /health endpoint
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
    }

    # Backend API Routes — Proxy to internal Express server
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
    }

    # Socket.IO Real-Time Feeds — WebSocket upgrade configuration
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA Fallback — Client-side React Router navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
